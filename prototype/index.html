<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="VERIGATE prototype: an independent accountability layer between your personal AI agent and the services it acts on.">
  <title>VERIGATE prototype</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M12 2 4 5v6c0 5 3.4 9.4 8 11 4.6-1.6 8-6 8-11V5z' fill='%233346d3'/%3E%3Cpath d='m8.5 12 2.5 2.5 4.5-5' fill='none' stroke='white' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <a class="skip" href="#view">Skip to content</a>
  <div class="sample-banner" role="note">
    <strong>Prototype</strong> &middot; Sample data set in March 2040 &middot; The agent is simulated and nothing connects to real accounts or services
  </div>

  <div class="shell">
    <aside class="sidebar">
      <a class="brand" href="#/home" aria-label="VERIGATE home">
        <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 4 5v6c0 5 3.4 9.4 8 11 4.6-1.6 8-6 8-11V5z"/><path class="tick" d="m8.5 12 2.5 2.5 4.5-5"/></svg>
        <span class="brand-text"><span class="brand-name">VERIGATE</span><span class="brand-tag">Verify before AI acts</span></span>
      </a>
      <nav class="nav" aria-label="Main">
        <a href="#/home" data-nav="home"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h5v-6h4v6h5V9.5"/></svg><span>Home</span></a>
        <a href="#/approvals" data-nav="approvals"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 13h5l1.5 3h5L16 13h5"/><path d="M5.5 5h13L21 13v6H3v-6z"/></svg><span>Approvals</span><span class="badge-n" data-badge="approvals" hidden>0</span></a>
        <a href="#/rules" data-nav="rules"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg><span>Agents &amp; Rules</span></a>
        <a href="#/memory" data-nav="memory"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.2-4 4.3-6 8-6s6.8 2 8 6"/></svg><span>Memory</span></a>
        <a href="#/activity" data-nav="activity"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="18" r="1"/></svg><span>Activity</span></a>
        <a href="#/trust" data-nav="trust"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 4.5 6v5.5c0 4.6 3.2 8.4 7.5 9.5 4.3-1.1 7.5-4.9 7.5-9.5V6z"/></svg><span>Trust</span></a>
      </nav>
      <div class="sidebar-foot">
        <p>Local-first &middot; open-source design</p>
        <button class="linklike" type="button" data-act="reset">Reset demo</button>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <span class="clock" id="clock"></span>
        <div class="topbar-right">
          <span id="agent-pill" class="pill"></span>
          <button id="pause-btn" class="btn btn--pause" type="button" data-act="pause"></button>
        </div>
      </header>
      <div id="pause-strip" class="pause-strip" role="status" hidden></div>
      <main id="view" class="view" tabindex="-1">
        <noscript><p style="padding:24px">This prototype needs JavaScript. Please enable it and reload.</p></noscript>
      </main>
    </div>
  </div>

  <div id="modal-root" hidden></div>
  <div id="toast-root" class="toasts" aria-live="polite"></div>

  <!-- Classic scripts in dependency order. ES modules and fetch() are blocked on file://. -->
  <script src="js/data.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/state.js"></script>
  <script src="js/views.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
