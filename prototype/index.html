<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Verigate</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23f4f0e6'/%3E%3Crect x='5' y='8' width='4' height='20' fill='%231c1a17'/%3E%3Crect x='9' y='10' width='19' height='5' fill='%231c1a17'/%3E%3Cpath d='M14 10l-3 5M19 10l-3 5M24 10l-3 5' stroke='%23f4f0e6' stroke-width='2'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <a class="skip" href="#view">Skip to content</a>

  <header class="masthead">
    <div class="mast">
      <a class="wordmark" href="#/home">
        <svg viewBox="0 0 34 22" aria-hidden="true">
          <rect x="1" y="2" width="4.5" height="20"/>
          <rect class="arm" x="5.5" y="4.75" width="27.5" height="6.5"/>
          <rect x="10" y="4" width="5" height="8"/>
          <rect x="20" y="4" width="5" height="8"/>
          <rect x="30" y="4" width="3.75" height="8"/>
        </svg>
        verigate
      </a>
      <nav class="nav" aria-label="Main">
        <a href="#/home" data-nav="home">Overview</a>
        <a href="#/approvals" data-nav="approvals">Approvals <span class="count" data-badge="approvals" hidden>0</span></a>
        <a href="#/rules" data-nav="rules">Rules</a>
        <a href="#/memory" data-nav="memory">Memory</a>
        <a href="#/log" data-nav="log">Log</a>
        <a href="#/how" data-nav="how">How it works</a>
      </nav>
      <div class="agent-ctl">
        <span id="agent-state" class="state"></span>
        <button id="pause-btn" class="btn btn--small" type="button"></button>
      </div>
    </div>
  </header>

  <p class="proto"><span>Prototype with sample data. Not connected to any real account or service.</span> <span id="clock"></span></p>
  <div id="pause-strip" class="strip" role="status" hidden></div>

  <main id="view" class="view" tabindex="-1">
    <noscript><p>This needs JavaScript turned on.</p></noscript>
  </main>

  <footer class="foot">
    <span>Verigate, prototype</span>
    <button class="linkbtn" type="button" data-act="reset">Reset demo</button>
  </footer>

  <div id="modal-root" hidden></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>

  <!-- Plain scripts, not modules: modules don't load from file:// -->
  <script src="js/data.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/state.js"></script>
  <script src="js/views.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
